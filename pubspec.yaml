name: daily_flutter_demo
description: Demo application showcasing use of the Daily Flutter SDK.
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

publish_to: none

dependencies:
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  daily_flutter: ^0.40.0
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.3.2

# TODO: remove this block when daily_flutter 0.40.0 is published on pub.dev.
# Temporary: build against the local daily-x checkout until daily_flutter 0.40.0
# is published on pub.dev. Remove this block before merging.
dependency_overrides:
  daily_flutter:
    path: ../../../daily-x/daily-flutter

dev_dependencies:
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

